<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Exam simulator with multiple question categories and mathematical notation support"
    />
    <title>Exam Simulator</title>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)']],
          displayMath: [['\\[', '\\]']],
          processEscapes: true,
        },
        chtml: {
          scale: 1.03,
        },
        startup: {
          pageReady: () =>
            MathJax.startup.defaultPageReady().then(() => {
              window.dispatchEvent(new Event('mathjax-ready'));
            }),
        },
      };
    </script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
